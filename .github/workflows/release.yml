name: Release

# Apple-Silicon-only release pipeline.
#
# Builds Messy for macOS arm64 on an Apple-Silicon runner, generates release
# notes, and publishes a GitHub Release whose assets feed electron-updater
# auto-update (the .dmg + its .blockmap + latest-mac.yml).
#
# Signing: signs + notarizes with a Developer ID when the signing secrets are
# present, and otherwise falls back to an ad-hoc (locally-runnable,
# non-distributable) build. It never fails purely for missing secrets.
#
# The changelog, tag and GitHub Release steps come from
# hungdoansy/desktop-release-actions. Tick "Dry run" to test the pipeline: it builds and
# shows what it would publish, but pushes nothing.
#
# Before adding signing secrets, move the signed build into its own job that runs no
# shared action, so public code never shares a runner with them.
#
# NOTE: this job commits the version bump + changelog and pushes main + a tag.
# `main` must permit direct pushes from github-actions[bot]; if branch
# protection blocks the push, the build will succeed but the release step will
# fail. Add a bypass for the bot (or relax protection) before the first run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build everything, but push and publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64)
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and draft notes
        id: meta
        uses: hungdoansy/desktop-release-actions/validate-and-draft-notes@v1
        with:
          version: ${{ inputs.version }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Run tests
        run: pnpm test

      - name: Set package version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Determine signing mode
        id: signmode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CSC_LINK secret — building ad-hoc (not distributable, no auto-update)."
          fi

      - name: Decode notarization key
        id: notarize
        if: steps.signmode.outputs.signed == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
            echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK present but APPLE_API_KEY missing — signing without notarization."
          fi

      - name: Build (signed + notarized)
        if: steps.signmode.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder expects APPLE_API_KEY to be a path to the .p8 file.
          APPLE_API_KEY: ${{ steps.notarize.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac dmg --arm64 --publish never -c.mac.notarize=${{ steps.notarize.outputs.enabled }}

      - name: Build (ad-hoc, unsigned)
        if: steps.signmode.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --arm64 --publish never

      # Keeps the installers if the GitHub Release step fails after the push.
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: messy-${{ steps.meta.outputs.version }}
          retention-days: 7
          path: |
            dist/*-arm64.dmg
            dist/*-arm64.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Prepend release to CHANGELOG.md
        uses: hungdoansy/desktop-release-actions/prepend-changelog-entry@v1
        with:
          heading: "## [{version}] - {date}"
          tag: ${{ steps.meta.outputs.tag }}
          date: ${{ steps.meta.outputs.date }}
          entries: ${{ steps.meta.outputs.changelog }}

      - name: Tag and publish
        uses: hungdoansy/desktop-release-actions/tag-and-publish-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          changelog: ${{ steps.meta.outputs.changelog }}
          dry-run: ${{ inputs.dry_run }}
          fail-on-unmatched-files: true
          paths: |
            package.json
            CHANGELOG.md
          # electron-updater feed: the dmg, its blockmap, AND latest-mac.yml.
          files: |
            dist/*-arm64.dmg
            dist/*-arm64.dmg.blockmap
            dist/latest-mac.yml
